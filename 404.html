<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada — Bobby Veterinaria</title>
  <link rel="icon" href="assets/img/logo_veterinaria.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #1158c4 0%, #1d6fd8 50%, #17bfbf 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 56px 48px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 32px 80px rgba(0,0,0,0.2);
    }
    .logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
      margin: 0 auto 24px;
      display: block;
    }
    .code {
      font-size: 88px;
      font-weight: 900;
      color: #1d6fd8;
      line-height: 1;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #1a2340;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: #718096;
      line-height: 1.65;
      margin-bottom: 36px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f06000;
      color: white;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 30px;
      border-radius: 50px;
      text-decoration: none;
      transition: background 0.2s, transform 0.15s;
    }
    .btn:hover { background: #d45500; transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="card">
    <img src="assets/img/logo_veterinaria.png" alt="Bobby Veterinaria" class="logo" />
    <div class="code">404</div>
    <h1>Página no encontrada</h1>
    <p>La página que buscas no existe o fue movida a otra dirección. Regresa al inicio y encuentra lo que necesitas.</p>
    <a href="index.html" class="btn">← Volver al inicio</a>
  </div>
</body>
</html>
